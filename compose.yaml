# Writes movie edition titles on a Plex server. See README.md for the
# settings and commands.
#
#   1. Point /config at the Plex data directory
#   2. Set PLEX_URL to an address this container can reach
#   3. docker compose up -d
services:
  editions:
    # pin a release with its tag, e.g. :v0.1.1 (see CHANGELOG.md)
    image: ghcr.io/plexassistant/plexeditions:latest
    environment:
      # 127.0.0.1 is this container. Use the host's address, or a sibling
      # container's name, or uncomment network_mode below.
      - PLEX_URL=http://127.0.0.1:32400
      # - PLEX_TOKEN=
      # - EDITION_MODULES=source;resolution;dynamicrange
      # en, zh, zh-TW, ja, ko, ar, fr, ru, es
      # - EDITION_LANG=zh
      # - EDITION_SKIP_LIBRARIES=
      # - EDITION_SEPARATOR= ·
    volumes:
      # the directory the Plex container mounts as /config
      - /path/to/plex/config:/config:ro
    restart: unless-stopped
    # network_mode: host
