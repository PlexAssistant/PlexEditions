name: CI

# Runners are pinned (not ubuntu-latest) so a release does not move
# with the image.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')"
          [ "$tag" = "$cargo_version" ] || {
            echo "tag v$tag does not match Cargo.toml version $cargo_version" >&2
            exit 1
          }

  # Native per arch. QEMU was the slow part of a release.
  # Untagged digests; manifest publishes the tags.
  image-amd64:
    needs: [test, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=ghcr.io/plexassistant/plexeditions,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  image-arm64:
    needs: [test, version]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=ghcr.io/plexassistant/plexeditions,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  manifest:
    needs: [image-amd64, image-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge arch images into the published tags
        run: |
          docker buildx imagetools create \
            -t ghcr.io/plexassistant/plexeditions:${{ github.ref_name }} \
            -t ghcr.io/plexassistant/plexeditions:latest \
            ghcr.io/plexassistant/plexeditions@${{ needs.image-amd64.outputs.digest }} \
            ghcr.io/plexassistant/plexeditions@${{ needs.image-arm64.outputs.digest }}
